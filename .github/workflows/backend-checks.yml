name: Backend checks

on:
  pull_request:
  push:
    branches: [develop, 'fix/**', 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/aihn_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack install
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node24-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run check

  integration:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/aihn_ci?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: aihn_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack install
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node24-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y redis-server
      - run: pnpm exec prisma generate
      - run: mkdir -p test-artifacts
      - run: pnpm run test:e2e > test-artifacts/e2e.log 2>&1
      - run: pnpm exec ts-node -r tsconfig-paths/register test/backend-fixes-live-smoke.ts > test-artifacts/live.log 2>&1
      - run: docker build --tag aihn-backend:technical-local . > test-artifacts/docker-build.log 2>&1
      - run: pnpm run test:docker:local > test-artifacts/docker-runtime.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-logs
          path: test-artifacts/*.log
